name: Build Freshly Ground APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Freshly Ground Standalone APK on GitHub
    runs-on: ubuntu-latest

    env:
      NODE_ENV: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Generate Android native project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build standalone release APK with bundled JavaScript
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Stage APK
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/release/app-release.apk release-apk/FreshlyGroundOrders-latest.apk
          test -s release-apk/FreshlyGroundOrders-latest.apk
          ls -lh release-apk/FreshlyGroundOrders-latest.apk

      - name: Upload APK for direct download
        uses: actions/upload-artifact@v4
        with:
          name: FreshlyGroundOrders-Standalone-APK
          path: release-apk/FreshlyGroundOrders-latest.apk
          if-no-files-found: error
          retention-days: 30
