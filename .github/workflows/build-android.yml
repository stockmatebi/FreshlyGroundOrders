name: Build Freshly Ground APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Freshly Ground APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify Expo account
        run: eas whoami

      - name: Build Android APK on EAS
        run: eas build --platform android --profile preview --non-interactive --wait

      - name: Download latest APK from EAS
        shell: bash
        run: |
          eas build:list --platform android --status finished --limit 1 --json --non-interactive > eas-build.json
          node -e "const fs=require('fs'); const b=JSON.parse(fs.readFileSync('eas-build.json','utf8'))[0]; if(!b?.artifacts?.buildUrl) process.exit(2); fs.writeFileSync('build-url.txt',b.artifacts.buildUrl);"
          BUILD_URL=$(cat build-url.txt)
          curl -L --fail "$BUILD_URL" -o FreshlyGroundOrders-v2.1.0.apk
          test -s FreshlyGroundOrders-v2.1.0.apk

      - name: Upload APK for direct download
        uses: actions/upload-artifact@v4
        with:
          name: FreshlyGroundOrders-v2.1.0-APK
          path: FreshlyGroundOrders-v2.1.0.apk
          if-no-files-found: error
          retention-days: 30
